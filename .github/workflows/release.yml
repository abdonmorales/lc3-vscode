name: Build & Release VSIX

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: vsce package --no-git-tag-version --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: lc3-assembly-vsix
          path: "*.vsix"

      - name: Attach VSIX to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.vsix --clobber

      - name: Publish to Open VSX
        if: github.event_name == 'release' && env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
