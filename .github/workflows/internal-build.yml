name: Build Internal VSIX (UT Austin · ECE 306)

# This workflow exists ONLY on the ut-internal branch and produces a
# VSIX that gets hand-uploaded to https://www.cs.utexas.edu/~abdonm/lc3-extension.html.
# It does NOT publish a GitHub release, does NOT touch Open VSX, and
# does NOT modify the public extension on master.

on:
  push:
    branches: [ut-internal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-git-tag-version --allow-missing-repository --out lc3-assembly-ut.vsix

      - name: Generate SHA-256 checksum
        run: sha256sum lc3-assembly-ut.vsix > lc3-assembly-ut.vsix.sha256

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: lc3-assembly-ut-vsix
          path: |
            lc3-assembly-ut.vsix
            lc3-assembly-ut.vsix.sha256
          retention-days: 90
